@if (this.times) {
  <p-table [value]="this.times" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Client Name</th>
        <th>total_time</th>
      </tr>
    </ng-template>
    <ng-template #body let-time>
      <tr>
        <td>{{ time.client_name }}</td>
        <td>{{ time.total_time ?? 0 }}</td>
      </tr>
    </ng-template>
  </p-table>
}
